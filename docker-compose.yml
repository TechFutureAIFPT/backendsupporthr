services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - supporthr

  backend:
    image: supporthr-backend:local
    build:
      context: ./api_server
      dockerfile: Dockerfile
    env_file:
      - ./api_server/.env
    environment:
      PORT: "8000"
      REDIS_INTERNAL_URL: redis://redis:6379/0
      ANALYSIS_JOB_MODE: redis
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-false}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=5).read()\""
        ]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    networks:
      - supporthr

  worker:
    image: supporthr-backend:local
    env_file:
      - ./api_server/.env
    environment:
      REDIS_INTERNAL_URL: redis://redis:6379/0
      ANALYSIS_JOB_MODE: redis
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-false}
    command: ["python", "-m", "app.workers.analysis_worker"]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - supporthr

  dozzle:
    image: amir20/dozzle:latest
    container_name: supporthr-dozzle
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - supporthr

  portainer:
    image: portainer/portainer-ce:latest
    container_name: supporthr-portainer
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    restart: unless-stopped
    networks:
      - supporthr

  render-manager:
    image: python:3.11-alpine
    container_name: supporthr-render-manager
    volumes:
      - ./deploy/render_manager:/app
    command: ["python", "/app/render_manager.py"]
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - supporthr

  docker-prune:
    image: docker:latest
    container_name: supporthr-docker-prune
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["sh", "-c", "echo 'Starting initial Docker cleanup...'; docker image prune -a -f; echo 'Cleanup finished. Entering 24h sleep loop...'; while true; do sleep 86400; docker image prune -a -f; done"]
    restart: unless-stopped
    networks:
      - supporthr

volumes:
  redis-data:
  portainer-data:

networks:
  supporthr:
    driver: bridge




